# k8s/app.yaml: buku tamu P7 di Kubernetes. Ganti SEMUA nim-24161562003.
apiVersion: v1
kind: Namespace
metadata: { name: nim-24161562003 }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: db, namespace: nim-24161562003 }
spec:
  replicas: 1
  selector: { matchLabels: { app: db } }
  template:
    metadata: { labels: { app: db } }
    spec:
      containers: # tanpa volume: lihat slide 27
        - name: postgres
          image: postgres:17-alpine
          env: # hanya latihan lokal (slide 27)
            - { name: POSTGRES_USER, value: app }
            - { name: POSTGRES_PASSWORD, value: latihan }
          ports: [{ containerPort: 5432 }]
          readinessProbe: # pengganti healthcheck compose
            exec: { command: [pg_isready, -U, app] }
            periodSeconds: 3
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata: { name: db, namespace: nim-24161562003 }
spec:
  selector: { app: db }
  ports: [{ port: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: web, namespace: nim-24161562003 }
spec:
  replicas: 1
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      containers:
        - name: web
          image: cc-nim-app:1.0
          imagePullPolicy: IfNotPresent # image dari kind load
          env: # host db = nama Service db
            - name: DATABASE_URL
              value: postgresql://app:latihan@db:5432/app
          ports: [{ containerPort: 8080 }]
          readinessProbe: # dalam (cek DB): atur trafik
            httpGet: { path: /health, port: 8080 }
            periodSeconds: 5
          livenessProbe: # dangkal: atur restart
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 10
            failureThreshold: 3
          lifecycle: # Pod lama melayani 5 dtk lagi
            preStop: { sleep: { seconds: 5 } }
          resources: # dari Tabel 2 (hasil ukurmu)
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 1000m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata: { name: web, namespace: nim-24161562003 }
spec:
  selector: { app: web }
  ports: [{ port: 80, targetPort: 8080 }]
