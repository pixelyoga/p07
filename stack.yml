services:
  app:
    image: cc-nim-app:1.0          # Swarm tidak mem-build: image dibuat dulu
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: postgresql://app:latihan@db:5432/app
    deploy:
      replicas: 2
      update_config: { parallelism: 1, delay: 5s, order: start-first }
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: latihan     # hanya untuk latihan lokal
    volumes: ["dbdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app"]
      interval: 3s
      retries: 10
volumes: { dbdata: {} }
